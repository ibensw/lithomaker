[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lithomaker"
version = "0.1.0"
description = "Convert a 2D image into a 3D-printable lithophane STL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lithomaker contributors" }]
keywords = ["lithophane", "stl", "3d-printing", "image", "heightmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Printing",
]
dependencies = [
    "Pillow>=9",
    "numpy>=1.21",
    "click>=8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.1"]

[project.scripts]
lithomaker = "lithomaker.cli:main"

[project.gui-scripts]
lithomaker-gui = "lithomaker.gui:main"

[project.urls]
Homepage = "https://example.invalid/lithomaker"

[tool.setuptools.packages.find]
include = ["lithomaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:lithomaker.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
